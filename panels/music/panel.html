<div class="music-header"><span>Now playing</span><span class="music-state" data-music-state></span></div>
<div class="music-track"><div class="music-record" aria-hidden="true"><img class="music-art" alt="" hidden><span class="music-spindle"></span></div><div class="music-info"><div class="music-title" data-music-title>Nothing playing</div><div class="music-artist" data-music-artist></div><div class="music-album" data-music-album></div></div></div>
<div class="music-bottom"><div class="music-level" hidden><div class="music-level-label" data-music-level-label>Output intensity</div><div class="music-level-track" role="meter" aria-label="System output peak intensity" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div></div><div class="music-timeline" hidden><progress max="1" value="0" aria-label="Track progress"></progress><div class="music-times"><span data-music-position></span><span data-music-duration></span></div></div><button class="music-connect" type="button" hidden>Connect music</button></div>

<div class="music-level-status" data-music-level-status></div><div class="music-level-actions"><button class="music-level-connect" type="button" hidden>Enable level</button><button class="music-level-disable" type="button" hidden>Disable level</button><button class="music-level-retry" type="button" hidden>Retry level</button></div>

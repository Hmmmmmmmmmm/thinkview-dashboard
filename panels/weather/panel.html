<div class="weather-layout">
  <div class="weather-top">
    <button
      class="location-button eyebrow"
      id="location-open"
      aria-label="Change weather location"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg
      ><span class="location-info"><span id="location-name">Hong Kong</span><span class="weather-updated" id="weather-updated">Updating…</span></span></button
    ><button
      class="icon-button"
      id="refresh-weather"
      aria-label="Refresh weather"
      title="Refresh weather"
    >
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 18px; height: 18px"><path d="M40 22a16 16 0 0 0-29-9.4L6 18m0-10v10h10M8 26a16 16 0 0 0 29 9.4L42 30m0 10V30H32"/></svg>
    </button>
  </div>
  <div class="weather-main">
    <div class="temperature"><span id="temperature">--</span><span class="degree">°C</span><span class="feels-like" aria-label="Feels like temperature"><span id="feels-like">—</span></span></div>
    <div class="weather-condition">
      <svg class="weather-art" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="20" cy="17" r="7"/><path d="M20 4v3M7 17h3M10.8 7.8l2.1 2.1M29.2 7.8l-2.1 2.1"/>
        <path d="M14 36h22a6 6 0 0 0 .3-12 10 10 0 0 0-18.8-1.8A7 7 0 0 0 14 36Z" fill="var(--md-sys-color-secondary-container, #f0e1b9)"/>
      </svg>
      <div class="weather-description" id="weather-description">Getting weather…</div>
    </div>
  </div>
  <div class="weather-meta">
    <span id="high-low">H —° &nbsp; L —°</span><span id="humidity">Humidity —%</span><span id="rain-chance">Rain —% · 30 min</span>
  </div>
</div>
<section class="rain-forecast" aria-label="One-hour precipitation forecast">
  <div class="rain-header"><span class="rain-value">— mm/h</span></div>
  <div class="rain-chart" role="img" aria-label="One-hour precipitation forecast"><div class="rain-y"><span>Storm</span><span>Heavy</span><span>Moderate</span><span>Light</span><span>No rain</span></div><svg viewBox="0 0 240 100" preserveAspectRatio="none" aria-hidden="true"><path class="rain-grid" d="M0 5H240 M0 27H240 M0 50H240 M0 72H240 M0 95H240"/><path class="rain-line" d=""/></svg></div>
  <div class="rain-axis"><span>Now · —</span><span>—</span><span>—</span></div>

</section>
<section class="daily-forecast" aria-label="Seven-day forecast"><div class="daily-columns"><span>Day</span><span>Sky</span><span>Rain</span><span>H / L</span><span>km/h</span></div><div id="daily-list"></div></section>
